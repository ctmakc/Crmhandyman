name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: file:./ci.db
      NEXTAUTH_SECRET: ci-only-secret
      NEXTAUTH_URL: http://localhost:3000
      RATE_LIMIT_PEPPER: ci-rate-limit-pepper
      LEAD_INTAKE_SIGNING_SECRET: ci-intake-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - run: npm ci
      - name: Block critical production dependency advisories
        run: npm audit --omit=dev --audit-level=critical
      - run: npx prisma generate
      - name: Apply complete migration chain
        run: npx prisma migrate deploy
      - name: Run database business regression
        run: npm run test:db
      - name: Run core regression
        run: npm run test:core
      - name: Run ESLint
        run: npx eslint . --format json --output-file eslint-report.json
      - name: Upload ESLint report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: eslint-report.json
          if-no-files-found: ignore
      - name: Run TypeScript typecheck
        run: npm run typecheck > typecheck-report.txt 2>&1
      - name: Upload TypeScript report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-report
          path: typecheck-report.txt
          if-no-files-found: ignore
      - name: Build production application
        run: npm run build
