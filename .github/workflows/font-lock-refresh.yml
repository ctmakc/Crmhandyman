name: One-shot font lock refresh

on:
  push:
    branches:
      - agent/font-build-stability
    paths:
      - .github/workflows/font-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/font-build-stability
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --package-lock-only
      - run: npm audit --omit=dev --audit-level=critical
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes required"
          else
            git commit -m "chore: lock self-hosted Chivo fonts"
            git push origin HEAD:agent/font-build-stability
          fi
