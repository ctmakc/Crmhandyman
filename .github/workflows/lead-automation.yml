name: Lead automation processor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Process due lead automation
        env:
          PROCESSOR_URL: ${{ secrets.AUTOMATION_PROCESSOR_URL }}
          PROCESSOR_SECRET: ${{ secrets.AUTOMATION_CRON_SECRET }}
        run: |
          if [ -z "$PROCESSOR_URL" ] || [ -z "$PROCESSOR_SECRET" ]; then
            echo "Lead automation scheduler is not configured; nothing to do."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            --max-time 60 \
            -X POST \
            -H "Authorization: Bearer $PROCESSOR_SECRET" \
            "$PROCESSOR_URL/api/webhooks/lead-automation?limit=50"
