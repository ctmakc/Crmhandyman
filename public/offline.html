<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>No signal — HandymanPro</title>
    <!--
      The last card in the deck: shown when the phone is offline AND this browser has
      never loaded the field screen, so there is nothing honest to show. Tokens are
      copied here by hand because the built stylesheet is hashed and this page has to
      stand on its own with no network at all — keep them in step with
      src/app/globals.css. `--ink-3` sat one revision behind, and this was the one
      surface where the product's own contrast fix had never landed.
    -->
    <style>
      /* The product is set in Chivo everywhere else, and this card is the surface
         the tech sees most often. `next/font` hashes its files, so this page keeps
         its own copy under /fonts and the service worker precaches both. If they
         ever go missing the stack below falls back to what this page used to be. */
      @font-face {
        font-family: "Chivo Offline";
        src: url("/fonts/chivo-latin.woff2") format("woff2");
        font-weight: 400 900;
        font-display: swap;
      }
      @font-face {
        font-family: "Chivo Mono Offline";
        src: url("/fonts/chivo-mono-latin.woff2") format("woff2");
        font-weight: 400 700;
        font-display: swap;
      }
      :root {
        --navy-900: #0e1626;
        --deck: #edf0f4;
        --plate: #fbfcfd;
        --line: #d3dbe4;
        --ink: #131a26;
        --ink-2: #45536c;
        --ink-3: #59677d;
        --amber: #ffb020;
        --r: 3px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--deck);
        color: var(--ink);
        font-family: "Chivo Offline", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .ticket {
        position: relative;
        width: 100%;
        max-width: 420px;
        background: var(--plate);
        border: 1px solid var(--line);
        border-left: 4px solid var(--amber);
        border-radius: var(--r);
        padding: 22px 20px 26px;
      }
      /* The punched notch — the plate is a torn ticket, not a card. */
      .ticket::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -1px;
        width: 20px;
        height: 10px;
        margin-left: -10px;
        background: var(--deck);
        border: 1px solid var(--line);
        border-bottom: 0;
        border-radius: 999px 999px 0 0;
      }
      .eyebrow {
        font-family: "Chivo Mono Offline", ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--ink-3);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .lamp {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: var(--amber);
      }
      h1 {
        margin: 12px 0 0;
        font-size: 30px;
        font-weight: 900;
        letter-spacing: -0.025em;
        line-height: 0.95;
      }
      p {
        margin: 12px 0 0;
        font-size: 14px;
        line-height: 1.5;
        color: var(--ink-2);
      }
      button {
        margin-top: 20px;
        width: 100%;
        height: 48px;
        border: 1px solid var(--navy-900);
        background: var(--navy-900);
        color: var(--plate);
        border-radius: var(--r);
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="ticket">
      <div class="eyebrow"><span class="lamp"></span>No signal</div>
      <h1 id="head">Nothing cached yet</h1>
      <p id="body">
        This phone has not opened the board while it had a network, so there is no copy of
        today&rsquo;s stops to show. Open the app once with a signal and it will keep working
        down in the basement.
      </p>
      <button id="go" onclick="location.replace('/today')">Try again</button>
    </div>
    <script>
      /**
       * TWO DIFFERENT PIECES OF BAD NEWS, and telling them apart is the whole job of
       * this card.
       *
       * It is served for ANY page the worker has no copy of, which includes a job card
       * opened from a board that IS saved. A tech who had been reading his stops all
       * morning was then told this phone had never opened the board — plainly untrue,
       * and it reads as "the app has lost my day". The stored board is checked first,
       * and if it is there the card says so and points back at it.
       *
       * The key matches src/lib/offline-queue.ts; a mismatch simply falls through to the
       * cautious wording, which is the safe direction.
       */
      (function () {
        var saved = null;
        try {
          saved = JSON.parse(localStorage.getItem("hp.field.v1.today") || "null");
        } catch (e) {
          /* storage denied — treat it as nothing saved */
        }

        if (saved && saved.jobs && saved.jobs.length) {
          var at = new Date(saved.fetchedAt);
          var clock = String(at.getHours()).padStart(2, "0") + ":" + String(at.getMinutes()).padStart(2, "0");
          document.getElementById("head").textContent = "This page needs a signal";
          document.getElementById("body").innerHTML =
            "Today&rsquo;s stops are saved on this phone as of <strong>" + clock + "</strong> and still open. " +
            "This particular page was never loaded down here, so there is no copy of it. " +
            "Photos and taking a payment need a signal too &mdash; starting and finishing a job does not.";
          document.getElementById("go").textContent = "Back to today's stops";
        }

        // Come back on its own the moment the signal returns.
        addEventListener("online", function () {
          location.replace("/today");
        });
      })();
    </script>
  </body>
</html>
