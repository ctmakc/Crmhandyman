services:
  crm:
    build: .
    container_name: handyman-crm
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - crm-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      - DATABASE_URL=file:/app/data/crm.db
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-change-me-in-production}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - APP_VERSION=${APP_VERSION:-dev}
      - RATE_LIMIT_PEPPER=${RATE_LIMIT_PEPPER:-}
      - LEAD_INTAKE_SIGNING_SECRET=${LEAD_INTAKE_SIGNING_SECRET:-}
      - BACKUP_DIR=/app/data/backups
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-14}
      - EVIDENCE_DIR=/app/data/evidence
      - EVIDENCE_MAX_BYTES=${EVIDENCE_MAX_BYTES:-10485760}
      - META_APP_ID=${META_APP_ID:-}
      - META_APP_SECRET=${META_APP_SECRET:-}
      - META_WEBHOOK_VERIFY_TOKEN=${META_WEBHOOK_VERIFY_TOKEN:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - MAILGUN_WEBHOOK_SIGNING_KEY=${MAILGUN_WEBHOOK_SIGNING_KEY:-}

volumes:
  crm-data:
