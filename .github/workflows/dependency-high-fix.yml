name: One-shot high severity dependency fix

on:
  push:
    branches:
      - agent/dependency-security-wave
    paths:
      - .github/workflows/dependency-high-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dependency-security-wave
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - name: Apply non-breaking npm security fixes
        run: npm audit fix --package-lock-only || true
      - name: Require zero high/critical production advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Commit safe lock changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          if git diff --cached --quiet; then
            echo "No lock changes required"
          else
            git commit -m "chore: apply non-breaking production dependency security fixes"
            git push origin HEAD:agent/dependency-security-wave
          fi
