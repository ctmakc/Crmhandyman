name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: file:./ci.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Block critical production dependency advisories
        run: npm audit --omit=dev --audit-level=critical

      - run: npx prisma generate

      - name: Apply complete migration chain to a fresh database
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Validate production shell and compose files
        env:
          NEXTAUTH_SECRET: ci-only-secret
          NEXTAUTH_URL: https://crm.itopsi.com
        run: |
          bash -n \
            deploy/hostd/ssh-auth.sh \
            deploy/hostd/deploy.sh \
            deploy/hostd/status.sh \
            deploy/hostd/beaver-rollout.sh \
            deploy/hostd/backup-cron.sh \
            deploy/hostd/healthwatch.sh
          docker compose -f deploy/hostd/docker-compose.prod.yml config >/dev/null

          # Password mode must be reusable by child scripts without prompting, and Ctrl+C
          # must terminate rather than merely scrub SSHPASS and continue a production deploy.
          mockbin="$(mktemp -d)"
          printf '#!/bin/sh\nexit 0\n' > "$mockbin/sshpass"
          chmod +x "$mockbin/sshpass"
          set +e
          PATH="$mockbin:$PATH" HANDYCRM_DEPLOY_AUTH=password SSHPASS=ci-secret bash -c '
            source deploy/hostd/ssh-auth.sh
            handycrm_init_ssh root@example.invalid 222
            kill -INT $$
            echo SHOULD_NOT_CONTINUE
          '
          signal_status=$?
          set -e
          rm -rf "$mockbin"
          test "$signal_status" -eq 130

      # Docker runtime intentionally omits ts-node. Compile the operator provisioner as
      # ordinary CommonJS and run it from a directory beneath the repository root, which
      # mirrors /app/scripts -> /app/node_modules in the production image. Running the same
      # file from /tmp would intentionally break Node's parent-directory module lookup and
      # test a filesystem shape the container never has.
      - name: Compile production tenant provisioner
        run: |
          rm -rf .ci/operator-scripts
          mkdir -p .ci/operator-scripts
          npx tsc scripts/provision-tenant.ts \
            --outDir .ci/operator-scripts \
            --module commonjs \
            --target ES2022 \
            --moduleResolution node \
            --esModuleInterop \
            --skipLibCheck
          test -s .ci/operator-scripts/provision-tenant.js
          node .ci/operator-scripts/provision-tenant.js --help | grep -q "provision-tenant"

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
