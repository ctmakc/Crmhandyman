name: Database migration CI

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:

permissions:
  contents: read

jobs:
  migrate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./migration-ci.db
      NEXTAUTH_SECRET: ci-only-secret-not-for-production
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      SUPER_ADMIN_EMAILS: admin@example.test
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply all migrations to an empty database
        run: npx prisma migrate deploy

      - name: Exercise migrated database constraints
        run: node scripts/ci-database-smoke.mjs

      - name: Exercise lead claim concurrency constraints
        run: node scripts/ci-lead-claim-smoke.mjs

      - name: Exercise credit wallet integrity
        run: node scripts/ci-credit-integrity-smoke.mjs

      - name: Build application against migrated schema
        run: npm run build
