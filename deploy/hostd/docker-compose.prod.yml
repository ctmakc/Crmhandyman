# HandyCRM on hostd.Canada — app container plus a Cloudflare Tunnel.
#
# This box may already run nginx on :80/:443 for other sites, so nothing here publishes
# a public CRM port. The app is bound to loopback for operator health checks; public
# traffic arrives through cloudflared over the private compose network.
#
# Current public layout:
#   crm.itopsi.com          — platform front door
#   <slug>.itopsi.com       — customer workspaces
#   try.itopsi.com          — public demo workspace
#
# Values come from .env next to this file (start from .env.production.example).
# Run from the repo root on the box:
#   docker compose -f deploy/hostd/docker-compose.prod.yml up -d

name: handyman-crm

services:
  crm:
    build:
      context: ../..
      args:
        NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL:-support@itopsi.com}
        NEXT_PUBLIC_AUTH_ORIGIN: ${NEXT_PUBLIC_AUTH_ORIGIN:-}
        NEXT_PUBLIC_DEMO_SLUG: ${NEXT_PUBLIC_DEMO_SLUG:-}
        NEXT_PUBLIC_DEMO_EMAIL: ${NEXT_PUBLIC_DEMO_EMAIL:-}
        NEXT_PUBLIC_DEMO_PASSWORD: ${NEXT_PUBLIC_DEMO_PASSWORD:-}
    image: handyman-crm:latest
    container_name: handyman-crm
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-3080}:3000"
    volumes:
      - crm-var:/app/var
    networks:
      - tunnel
    environment:
      DATABASE_URL: file:/app/var/crm.db
      UPLOADS_DIR: /app/var/uploads

      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:?generate with openssl rand -base64 32}"
      NEXTAUTH_URL: ${NEXTAUTH_URL:?public https address of the CRM}
      CRM_HOME_HOST: ${CRM_HOME_HOST:-}
      NEXTAUTH_COOKIE_DOMAIN: ${NEXTAUTH_COOKIE_DOMAIN:-}

      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS:-}
      PLATFORM_TENANT_SLUG: ${PLATFORM_TENANT_SLUG:-}
      SELF_SERVE_SIGNUP: ${SELF_SERVE_SIGNUP:-}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}

      TRIAL_DAYS: ${TRIAL_DAYS:-7}
      LEAD_DEDUP_DAYS: ${LEAD_DEDUP_DAYS:-30}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-12}
      MAX_PHOTOS_PER_JOB: ${MAX_PHOTOS_PER_JOB:-40}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}

      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      MAILGUN_WEBHOOK_SIGNING_KEY: ${MAILGUN_WEBHOOK_SIGNING_KEY:-}

      # Required only when lead automation is enabled. The GitHub scheduler sends this
      # value as a Bearer token to /api/webhooks/lead-automation. Empty is deliberately
      # fail-closed: the endpoint refuses to process due customer messages.
      AUTOMATION_CRON_SECRET: ${AUTOMATION_CRON_SECRET:-}

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Locally managed Cloudflare Tunnel. The host-mounted config must route:
  #   crm.itopsi.com    -> http://crm:3000
  #   *.itopsi.com      -> http://crm:3000
  # The wildcard is what makes beaver-movers.itopsi.com and every future tenant work.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: handyman-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - /opt/handyman-crm/cloudflared:/etc/cloudflared:ro
    networks:
      - tunnel
    depends_on:
      crm:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  tunnel:

volumes:
  crm-var:
