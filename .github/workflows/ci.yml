name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: file:./ci.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Block critical production dependency advisories
        run: npm audit --omit=dev --audit-level=critical

      - run: npx prisma generate

      - name: Apply complete migration chain to a fresh database
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Validate production shell and compose files
        env:
          NEXTAUTH_SECRET: ci-only-secret
          NEXTAUTH_URL: https://crm.itopsi.com
        run: |
          bash -n \
            deploy/hostd/deploy.sh \
            deploy/hostd/status.sh \
            deploy/hostd/backup-cron.sh \
            deploy/hostd/healthwatch.sh
          docker compose -f deploy/hostd/docker-compose.prod.yml config >/dev/null

      # Docker runtime intentionally omits ts-node. Prove the operator provisioner can be
      # emitted and actually started as ordinary JS exactly the way the Dockerfile ships it.
      - name: Compile production tenant provisioner
        run: |
          rm -rf /tmp/operator-scripts
          npx tsc scripts/provision-tenant.ts \
            --outDir /tmp/operator-scripts \
            --module commonjs \
            --target ES2022 \
            --moduleResolution node \
            --esModuleInterop \
            --skipLibCheck
          test -s /tmp/operator-scripts/provision-tenant.js
          node /tmp/operator-scripts/provision-tenant.js --help | grep -q "provision-tenant"

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
