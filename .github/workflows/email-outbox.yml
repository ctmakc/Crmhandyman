name: Email outbox processor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  process-email-outbox:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OUTBOX_PROCESSOR_URL: ${{ secrets.OUTBOX_PROCESSOR_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Process due outbound emails
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${OUTBOX_PROCESSOR_URL}" || -z "${CRON_SECRET}" ]]; then
            echo "OUTBOX_PROCESSOR_URL or CRON_SECRET is not configured; skipping safely."
            exit 0
          fi

          base_url="${OUTBOX_PROCESSOR_URL%/}"
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 2 \
            --retry-all-errors \
            --max-time 60 \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${base_url}/api/internal/email-outbox/process?limit=100"
