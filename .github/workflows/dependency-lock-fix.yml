name: One-shot dependency lock fix

on:
  push:
    branches:
      - agent/production-wave-6
    paths:
      - .github/workflows/dependency-lock-fix.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-wave-6

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - name: Apply non-breaking npm security fixes to lockfile
        run: npm audit fix --package-lock-only
      - name: Confirm no critical production advisory remains
        run: npm audit --omit=dev --audit-level=critical

      - name: Commit resolved lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          if git diff --cached --quiet; then
            echo "No dependency lock changes required"
          else
            git commit -m "chore: refresh secure dependency lock"
            git push origin HEAD:agent/production-wave-6
          fi
